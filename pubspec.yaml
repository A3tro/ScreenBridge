name: screenbridge_ai
description: ScreenBridge AI - Japanese schedule review Flutter frontend demo.
publish_to: none
version: 0.2.0+2
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  flutter_localizations:
    sdk: flutter
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_ai: ^5.1.0
  connectivity_plus: ^7.3.2
  font_awesome_flutter: ^11.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/
    - assets/icons/
    - assets/images/
  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Regular.ttf
        - asset: assets/fonts/NotoSansJP-Bold.ttf
          weight: 700